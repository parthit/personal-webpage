<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Replication cover: a leader replica shipping writes to two followers">
  <defs>
    <linearGradient id="repl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="repl-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#repl-bg)"/>
  <circle cx="1040" cy="90" r="170" fill="#334155" opacity="0.4"/>
  <circle cx="140" cy="540" r="210" fill="#0ea5e9" opacity="0.14"/>

  <path d="M430 250 L250 430" stroke="#38bdf8" stroke-width="4" fill="none" marker-end="url(#repl-arrow)"/>
  <path d="M770 250 L950 430" stroke="#38bdf8" stroke-width="4" fill="none" marker-end="url(#repl-arrow)"/>
  <circle cx="340" cy="340" r="8" fill="#fbbf24"/>
  <circle cx="860" cy="340" r="8" fill="#fbbf24"/>

  <g>
    <rect x="470" y="150" width="260" height="120" rx="16" fill="#e0f2fe"/>
    <text x="600" y="198" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#0369a1">LEADER - NYC</text>
    <text x="600" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" fill="#0f172a">likes = 7</text>
  </g>
  <g>
    <rect x="80" y="430" width="240" height="110" rx="16" fill="#f8fafc"/>
    <text x="200" y="474" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#475569">FOLLOWER - LONDON</text>
    <text x="200" y="512" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#0f172a">likes = 4</text>
  </g>
  <g>
    <rect x="880" y="430" width="240" height="110" rx="16" fill="#f8fafc"/>
    <text x="1000" y="474" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#475569">FOLLOWER - TOKYO</text>
    <text x="1000" y="512" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#0f172a">likes = 7</text>
  </g>

  <text x="64" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#f8fafc">Replication</text>
  <text x="64" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#94a3b8">Keeping copies in sync, and noticing when they are not</text>
</svg>
