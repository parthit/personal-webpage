<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Consistent hashing cover: keys walk clockwise on a ring to the next vnode">
  <defs>
    <linearGradient id="ch-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ch-bg)"/>
  <circle cx="180" cy="80" r="180" fill="#334155" opacity="0.45"/>
  <circle cx="1080" cy="540" r="220" fill="#38bdf8" opacity="0.12"/>

  <text x="64" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#f8fafc">Consistent hashing</text>
  <text x="64" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#94a3b8">Only the keys on a claimed arc have to move</text>

  <g transform="translate(760 330)">
    <circle r="210" fill="none" stroke="#64748b" stroke-width="8"/>
    <path d="M0 -168 A168 168 0 0 1 118 118" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-210" r="16" fill="#38bdf8"/>
    <circle cx="182" cy="-105" r="16" fill="#f59e0b"/>
    <circle cx="182" cy="105" r="16" fill="#34d399"/>
    <circle cx="-182" cy="105" r="16" fill="#38bdf8"/>
    <circle cx="-182" cy="-105" r="16" fill="#f59e0b"/>
    <circle cx="118" cy="-118" r="9" fill="#e2e8f0"/>
    <circle cx="40" cy="-160" r="9" fill="#e2e8f0"/>
    <circle cx="90" cy="140" r="9" fill="#e2e8f0"/>
    <circle cx="-70" cy="150" r="9" fill="#e2e8f0"/>
    <circle cx="118" cy="118" r="12" fill="#fbbf24" stroke="#0f172a" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#94a3b8">hash ring</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#cbd5e1">
    <text x="64" y="220">hash(key) % N</text>
    <text x="64" y="252" fill="#fb7185">reshuffles most keys</text>
    <text x="64" y="320">hash(key) and hash(node)</text>
    <text x="64" y="352" fill="#34d399">walk clockwise · move the arc</text>
  </g>
</svg>
