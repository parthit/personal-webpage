<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Specialized vision vs VLM cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="120" r="160" fill="#14b8a6" opacity="0.12"/>
  <circle cx="1000" cy="520" r="200" fill="#6366f1" opacity="0.14"/>

  <!-- left camera: specialized -->
  <rect x="80" y="160" width="480" height="340" rx="18" fill="#0f172a" stroke="#2dd4bf" stroke-width="3"/>
  <text x="110" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#5eead4">SPECIALIZED · 28ms</text>
  <rect x="150" y="250" width="160" height="180" rx="8" fill="none" stroke="#34d399" stroke-width="3"/>
  <rect x="150" y="226" width="110" height="22" rx="4" fill="#34d399"/>
  <text x="158" y="242" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#064e3b">forklift 91%</text>
  <rect x="360" y="320" width="120" height="90" rx="6" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- right camera: VLM -->
  <rect x="640" y="160" width="480" height="340" rx="18" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
  <text x="670" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#a5b4fc">VLM · 840ms</text>
  <rect x="710" y="250" width="160" height="180" rx="8" fill="none" stroke="#34d399" stroke-width="3"/>
  <rect x="710" y="226" width="150" height="22" rx="4" fill="#34d399"/>
  <text x="718" y="242" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#064e3b">forklift in aisle</text>
  <rect x="920" y="320" width="120" height="90" rx="6" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <rect x="920" y="296" width="90" height="22" rx="4" fill="#fbbf24"/>
  <text x="928" y="312" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#78350f">pallet 61%</text>

  <text x="64" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#f8fafc">Specialized vision vs VLMs</text>
  <text x="64" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#94a3b8">When a fixed detector beats an open-vocabulary model</text>
</svg>
