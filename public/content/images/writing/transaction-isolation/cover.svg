<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Transaction isolation cover: requests travel to accounts, spend time processing, and return responses">
  <defs>
    <linearGradient id="tx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="tx-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#tx-bg)"/>
  <circle cx="160" cy="90" r="180" fill="#334155" opacity="0.45"/>
  <circle cx="1080" cy="540" r="220" fill="#f59e0b" opacity="0.12"/>

  <text x="64" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#f8fafc">Isolation</text>
  <text x="64" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#94a3b8">Which writes a read is allowed to miss</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="80" y="200" font-size="13" fill="#94a3b8">Alice</text>
    <line x1="160" y1="196" x2="1080" y2="196" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="280" font-size="13" fill="#94a3b8">Bob</text>
    <line x1="160" y1="276" x2="1080" y2="276" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="400" font-size="13" fill="#94a3b8">Account 1</text>
    <line x1="160" y1="396" x2="1080" y2="396" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="500" font-size="13" fill="#94a3b8">Account 2</text>
    <line x1="160" y1="496" x2="1080" y2="496" stroke="#64748b" stroke-width="2"/>

    <path d="M260 196 L360 396" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#tx-arrow)"/>
    <rect x="360" y="388" width="62" height="16" rx="8" fill="#38bdf8"/>
    <text x="391" y="380" text-anchor="middle" font-size="11" fill="#7dd3fc">work</text>
    <path d="M422 396 L522 196" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#tx-arrow)"/>
    <text x="300" y="280" font-size="14" fill="#fde68a">SELECT 500</text>

    <path d="M450 276 L550 396" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#tx-arrow)"/>
    <rect x="550" y="388" width="62" height="16" rx="8" fill="#38bdf8"/>
    <text x="581" y="380" text-anchor="middle" font-size="11" fill="#7dd3fc">work</text>
    <path d="M612 396 L712 276" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#tx-arrow)"/>
    <text x="490" y="350" font-size="14" fill="#fde68a">SELECT 500</text>

    <path d="M720 196 L820 496" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#tx-arrow)"/>
    <text x="730" y="330" font-size="14" fill="#fde68a">UPDATE 400</text>

    <rect x="240" y="186" width="280" height="20" rx="4" fill="#fbbf24" opacity="0.2"/>
    <rect x="410" y="266" width="320" height="20" rx="4" fill="#38bdf8" opacity="0.18"/>
    <rect x="260" y="210" width="262" height="6" rx="3" fill="#a78bfa" opacity="0.8"/>
    <text x="391" y="231" text-anchor="middle" font-size="11" fill="#c4b5fd">waiting for response</text>
    <text x="250" y="182" font-size="12" fill="#fbbf24">begin</text>
    <text x="520" y="182" font-size="12" fill="#34d399">commit</text>
    <text x="420" y="262" font-size="12" fill="#38bdf8">begin</text>
    <text x="730" y="262" font-size="12" fill="#fb7185">abort?</text>
  </g>
</svg>
