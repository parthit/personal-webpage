<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="B-tree cover illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="180" fill="#334155" opacity="0.35"/>
  <circle cx="160" cy="520" r="220" fill="#0ea5e9" opacity="0.12"/>

  <!-- edges -->
  <g stroke="#64748b" stroke-width="3" fill="none">
    <path d="M600 180 L360 300"/>
    <path d="M600 180 L840 300"/>
    <path d="M360 340 L240 460"/>
    <path d="M360 340 L480 460"/>
    <path d="M840 340 L720 460"/>
    <path d="M840 340 L960 460"/>
  </g>

  <!-- root -->
  <g>
    <rect x="510" y="140" width="180" height="56" rx="10" fill="url(#node)"/>
    <line x1="570" y1="150" x2="570" y2="186" stroke="#94a3b8"/>
    <line x1="630" y1="150" x2="630" y2="186" stroke="#94a3b8"/>
    <text x="540" y="175" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#0f172a">20</text>
    <text x="600" y="175" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#0f172a">40</text>
    <text x="660" y="175" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#0f172a">60</text>
  </g>

  <!-- internal left -->
  <g>
    <rect x="285" y="300" width="150" height="52" rx="10" fill="url(#node)"/>
    <line x1="360" y1="310" x2="360" y2="342" stroke="#94a3b8"/>
    <text x="322" y="333" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#0f172a">10</text>
    <text x="398" y="333" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#0f172a">15</text>
  </g>

  <!-- internal right -->
  <g>
    <rect x="765" y="300" width="150" height="52" rx="10" fill="url(#node)"/>
    <line x1="840" y1="310" x2="840" y2="342" stroke="#94a3b8"/>
    <text x="802" y="333" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#0f172a">50</text>
    <text x="878" y="333" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#0f172a">70</text>
  </g>

  <!-- leaves -->
  <g>
    <rect x="175" y="460" width="130" height="48" rx="10" fill="#38bdf8"/>
    <text x="240" y="490" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#0f172a">3  7</text>
    <rect x="415" y="460" width="130" height="48" rx="10" fill="#38bdf8"/>
    <text x="480" y="490" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#0f172a">12 18</text>
    <rect x="655" y="460" width="130" height="48" rx="10" fill="#38bdf8"/>
    <text x="720" y="490" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#0f172a">45 55</text>
    <rect x="895" y="460" width="130" height="48" rx="10" fill="#38bdf8"/>
    <text x="960" y="490" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#0f172a">65 80</text>
  </g>

  <text x="64" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#f8fafc">B-Trees</text>
  <text x="64" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#94a3b8">Balanced search trees for memory &amp; disk indexes</text>
</svg>
