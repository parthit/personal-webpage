  <text x="640" y="420" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#86efac">amount -&gt; auto</text>
  <text x="640" y="475" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#fca5a5">gl -&gt; ask user</text>

  <text x="64" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#f8fafc">Document AI</text>
  <text x="64" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#94a3b8">Match extracted fields without trusting OCR</text>
