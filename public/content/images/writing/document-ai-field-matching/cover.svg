<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Document AI field matching cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ee"/>
      <stop offset="100%" stop-color="#e8e2d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="90" r="200" fill="#0ea5e9" opacity="0.12"/>
  <circle cx="140" cy="540" r="180" fill="#34d399" opacity="0.1"/>

  <rect x="90" y="110" width="420" height="440" rx="14" fill="url(#paper)"/>
  <rect x="120" y="150" width="220" height="18" rx="4" fill="#94a3b8" opacity="0.45"/>
  <rect x="120" y="200" width="280" height="36" rx="6" fill="#7dd3fc" opacity="0.55" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="120" y="260" width="200" height="28" rx="6" fill="#bbf7d0" opacity="0.7" stroke="#34d399" stroke-width="2"/>
  <rect x="120" y="320" width="240" height="28" rx="6" fill="#fde68a" opacity="0.65" stroke="#f59e0b" stroke-width="2"/>
  <rect x="120" y="400" width="260" height="32" rx="6" fill="#fecaca" opacity="0.65" stroke="#f87171" stroke-width="2"/>

  <rect x="600" y="150" width="480" height="360" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="640" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#94a3b8">Schema</text>
  <text x="640" y="255" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#e2e8f0">vendor -&gt; review</text>
  <text x="640" y="310" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#86efac">invoice # -&gt; auto</text>
